<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oakline Staff Demo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2212%22 fill=%22%23175f88%22/%3E%3Ctext x=%2232%22 y=%2245%22 text-anchor=%22middle%22 font-size=%2242%22 font-family=%22Arial%22 font-weight=%22bold%22 fill=%22white%22%3EO%3C/text%3E%3C/svg%3E">
  <script type="module" src="/app.mjs"></script>
  <style>
    :root { font: 100%/1.6 system-ui, sans-serif; color: #193247; background: #f7f9fc; }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(100% - 2rem, 48rem); margin-inline: auto; padding-block: 2rem; }
    .panel, .project { background: #fff; border: 1px solid #91a6ba; border-radius: .75rem; padding: 1.25rem; margin-block: 1rem; }
    .field { display: grid; gap: .35rem; margin-bottom: 1rem; }
    label { font-weight: 650; }
    input, select { width: 100%; padding: .7rem; border: 2px solid #718697; border-radius: .4rem; font: inherit; }
    button { min-height: 44px; padding: .7rem 1rem; border: 2px solid #175f88; border-radius: .4rem; background: #175f88; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button.secondary { color: #175f88; background: white; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    :focus-visible { outline: 3px solid #a65300; outline-offset: 3px; }
    .actions { display: flex; flex-wrap: wrap; gap: .5rem; }
    .projects { padding: 0; list-style: none; }
    .project h3 { margin-top: 0; overflow-wrap: anywhere; }
    #status { padding: .8rem; background: #e5eef6; border-radius: .5rem; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Oakline Staff Project Tracker</h1>
    <p>Local training project. Use fictional records and passwords created only for this demonstration.</p>

    <section id="login-panel" class="panel" aria-labelledby="login-title">
      <h2 id="login-title">Staff Sign In</h2>
      <form id="login-form">
        <div class="field"><label for="username">Username</label><input id="username" required autocomplete="username"></div>
        <div class="field"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"></div>
        <p id="login-error" class="error" role="alert"></p>
        <button type="submit">Sign In</button>
      </form>
    </section>

    <section id="staff-panel" hidden aria-labelledby="staff-title">
      <h2 id="staff-title" tabindex="-1">Staff Workspace</h2>
      <p id="identity"></p>
      <button id="logout" type="button">Sign Out</button>

      <section id="editor-panel" class="panel" hidden aria-labelledby="editor-title">
        <h3 id="editor-title">Create Sample Project</h3>
        <form id="project-form">
          <div class="field">
            <label for="service">Service</label>
            <select id="service" required>
              <option value="kitchen">Kitchen</option>
              <option value="bathroom">Bathroom</option>
              <option value="basement">Basement</option>
              <option value="outdoors">Outdoors</option>
            </select>
          </div>
          <div class="field"><label for="project-label">Project Label</label><input id="project-label" maxlength="80" required></div>
          <button type="submit">Save Project</button>
        </form>
      </section>

      <section aria-labelledby="projects-title">
        <h3 id="projects-title" tabindex="-1">Saved Sample Projects</h3>
        <ul id="projects" class="projects"></ul>
      </section>
    </section>

    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
